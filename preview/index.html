639\u0628\u064A\u0646","players"],h1:["\u0627\u0633\u062D\u0628 \u0645\u0646 \u0645\u0628\u0646\u0649 \u0623\u062E\u0636\u0631 \u062A\u0645\u0644\u0643\u0647 \u0625\u0644\u0649 \u0623\u064A \u0645\u0628\u0646\u0649 \u0622\u062E\u0631 \u0644\u0625\u0631\u0633\u0627\u0644 \u0627\u0644\u062C\u0646\u0648\u062F. \u0623\u0641\u0644\u062A \u0641\u064A \u0645\u0643\u0627\u0646 \u0641\u0627\u0631\u063A \u0644\u0644\u0625\u0644\u063A\u0627\u0621.","Drag from a green building you own to any other building to send troops. Release on empty ground to cancel."],h2:["\u0623\u0632\u0631\u0627\u0631 25 / 50 / 75 / 100% \u0639\u0644\u0649 \u0627\u0644\u064A\u0633\u0627\u0631 \u062A\u062D\u062F\u062F \u0646\u0633\u0628\u0629 \u0627\u0644\u062C\u0646\u0648\u062F \u0627\u0644\u0645\u0631\u0633\u0644\u0629.","The 25 / 50 / 75 / 100% buttons on the left set how many troops leave."],h3:["\u0627\u0644\u0645\u0633 \u0645\u0628\u0646\u0627\u0643 \u0644\u062A\u062D\u062F\u064A\u062F\u0647\u060C \u062B\u0645 \u0627\u0644\u0645\u0633 \u0647\u062F\u0641\u0627\u064B \u0644\u0644\u0625\u0631\u0633\u0627\u0644. \u0627\u0636\u063A\u0637 \u0645\u0637\u0648\u0644\u0627\u064B \u0623\u0648 \u0627\u0631\u0633\u0645 \u0625\u0637\u0627\u0631\u0627\u064B \u0623\u0648 \u0627\u0633\u062A\u062E\u062F\u0645 \xAB\u062A\u062D\u062F\u064A\u062F \u0627\u0644\u0643\u0644\xBB \u0644\u062A\u062D\u062F\u064A\u062F \u0639\u062F\u0629 \u0645\u0628\u0627\u0646\u064D.","Tap your building to select it, then tap a target to send. Long-press, drag a box, or use \u201CSelect all\u201D to select several."],h9:["\u0632\u0631 \xAB\u0645\u0639\u0627\u064B\xBB \u23F1: \u0639\u0646\u062F \u0627\u0644\u0625\u0631\u0633\u0627\u0644 \u0645\u0646 \u0639\u062F\u0629 \u0645\u0628\u0627\u0646\u064D \u062A\u0646\u062A\u0638\u0631 \u0627\u0644\u0645\u0628\u0627\u0646\u064A \u0627\u0644\u0623\u0642\u0631\u0628 \u0644\u062A\u0635\u0644 \u0643\u0644 \u0627\u0644\u0643\u062A\u0627\u0626\u0628 \u0641\u064A \u0627\u0644\u0644\u062D\u0638\u0629 \u0646\u0641\u0633\u0647\u0627. \u064A\u0638\u0647\u0631 \u0648\u0642\u062A \u0627\u0644\u0648\u0635\u0648\u0644 \u0642\u0628\u0644 \u0627\u0644\u0625\u0641\u0644\u0627\u062A.","The \u23F1 Sync button: when sending from several buildings, nearer ones wait so every squad arrives at the same moment. Arrival time shows before you release."],h4:["\u0627\u0644\u0645\u0632\u0631\u0639\u0629 \u{1F966} \u062A\u0646\u062A\u062C \u0627\u0644\u062C\u0646\u0648\u062F. \u0627\u0644\u0628\u0631\u062C \u{1F5FC} \u064A\u0631\u0645\u064A \u0627\u0644\u0623\u0634\u0648\u0627\u0643 \u0639\u0644\u0649 \u0627\u0644\u0623\u0639\u062F\u0627\u0621 \u0627\u0644\u0645\u0627\u0631\u0651\u064A\u0646. \u0627\u0644\u062D\u062F\u0627\u062F\u0629 \u2600 \u062A\u0642\u0648\u0651\u064A \u0647\u062C\u0648\u0645\u0643 \u0648\u062F\u0641\u0627\u0639\u0643.","Farms \u{1F966} grow troops. Towers \u{1F5FC} shoot thorns at passing enemies. Forges \u2600 boost your attack and defence."],h5:["\u062D\u062F\u0651\u062F \u0645\u0628\u0646\u0649 \u0648\u0627\u062D\u062F\u0627\u064B \u0644\u062A\u0631\u0642\u064A\u062A\u0647 \u0623\u0648 \u062A\u062D\u0648\u064A\u0644\u0647 \u0645\u0646 \u0627\u0644\u0623\u0632\u0631\u0627\u0631 \u0639\u0644\u0649 \u0627\u0644\u064A\u0645\u064A\u0646. \u0627\u0644\u062A\u0631\u0642\u064A\u0629 \u0648\u0627\u0644\u062A\u062D\u0648\u064A\u0644 \u064A\u0643\u0644\u0651\u0641\u0627\u0646 \u062C\u0646\u0648\u062F\u0627\u064B \u0648\u0648\u0642\u062A\u0627\u064B.","Select one building to upgrade or convert it with the buttons on the right. Both cost troops and time."],h6:["\u0627\u0644\u0623\u0648\u0631\u0627\u0642 \u{1F343} \u0647\u064A \u0645\u0639\u0646\u0648\u064A\u0627\u062A\u0643: \u062A\u0631\u062A\u0641\u0639 \u0628\u0627\u0644\u0627\u0633\u062A\u064A\u0644\u0627\u0621 \u0648\u0627\u0644\u062F\u0641\u0627\u0639 \u0648\u0627\u0644\u062A\u0631\u0642\u064A\u0629 \u0648\u062A\u0632\u064A\u062F \u0642\u0648\u062A\u0643 \u0648\u0633\u0631\u0639\u062A\u0643\u060C \u0648\u062A\u0646\u062E\u
